document.getElementById('label').onclick=()=>{const panel=document.getElementById('settings'),open=panel.hidden;panel.hidden=!open;document.getElementById('label').setAttribute('aria-expanded',String(open));};

document.getElementById('trails').onchange=e=>{visualFlags.trails=e.target.checked;if(paused)renderNow();};document.getElementById('lens').onchange=e=>{visualFlags.lens=e.target.checked;if(paused)renderNow();};document.getElementById('foam').oninput=e=>{foamAmount=+e.target.value;if(paused)renderNow();};document.getElementById('quality').onchange=e=>setQualityMode(e.target.value);
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let stickId=null;
function moveStick(e){const r=stick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.34),y=-(e.clientY-r.top-r.height/2)/(r.height*.34),l=Math.max(1,Math.hypot(x,y));touchMove.x=x/l;touchMove.y=y/l;nub.style.transform=`translate(${touchMove.x*29}px,${-touchMove.y*29}px)`;}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});function releaseStick(){stickId=null;touchMove.x=touchMove.y=0;nub.style.transform='';}stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true;});
const timerExt=gl.getExtension('EXT_disjoint_timer_query_webgl2'),queries=[];let gpuCompute=null,gpuRender=null;
function beginTimer(kind){if(!timerExt||queries.length>8)return null;const q=gl.createQuery();gl.beginQuery(timerExt.TIME_ELAPSED_EXT,q);return {q,kind};}
function endTimer(v){if(v){gl.endQuery(timerExt.TIME_ELAPSED_EXT);queries.push(v);}}
function pollTimers(){if(!timerExt)return;const disjoint=gl.getParameter(timerExt.GPU_DISJOINT_EXT);for(let i=queries.length-1;i>=0;i--){const a=queries[i];if(gl.getQueryParameter(a.q,gl.QUERY_RESULT_AVAILABLE)){if(!disjoint){const ms=gl.getQueryParameter(a.q,gl.QUERY_RESULT)/1e6;if(a.kind==='compute')gpuCompute=gpuCompute===null?ms:mix(gpuCompute,ms,.2);else gpuRender=gpuRender===null?ms:mix(gpuRender,ms,.2);}gl.deleteQuery(a.q);queries.splice(i,1);}}}
let lastTime=performance.now(),fps=null,cpuMs=0,hudClock=0,substeps=0,fpsWindow=0,fpsFrames=0;
function frame(now){requestAnimationFrame(frame);if(paused||document.hidden){lastTime=now;return;}const start=performance.now(),raw=(now-lastTime)/1000,dt=clamp(raw,.001,.032);lastTime=now;fpsWindow+=raw;fpsFrames++;if(fpsWindow>.6){fps=fpsFrames/fpsWindow;fpsWindow=0;fpsFrames=0;}frameNumber++;const q=frameNumber%20===0?beginTimer('compute'):null;advance(dt);substeps=sim.lastSubsteps;endTimer(q);
 sampleClock+=dt;if(!samplePending&&sampleClock>.028){sampleClock=0;samplePending=true;const epoch=waterEpoch;sim.sample(player.x,player.z).then(s=>{if(epoch===waterEpoch&&Number.isFinite(s.eta))localWater=s;samplePending=false;}).catch(error=>{samplePending=false;console.error(error);});}
 adaptQuality(raw);updateCamera(dt);pollTimers();const r=frameNumber%20===0?beginTimer('render'):null;renderNow();endTimer(r);cpuMs=mix(cpuMs,performance.now()-start,.06);hudClock+=dt;if(hudClock>.25){hudClock=0;const fmt=n=>n===null?'n/a':n.toFixed(2)+' ms';hud.textContent=`${fps===null?'…':Math.round(fps)} fps   cpu ${cpuMs.toFixed(2)} ms   gpu compute ${fmt(gpuCompute)}   gpu render ${fmt(gpuRender)}\nsim 256² @ 12.5 cm, ${substeps} substep/frame   ·   sand 1024² · v9 test\nimmersione ${Math.round(player.submerged*100)}%   eta ${localWater.eta.toFixed(2)} m   fondale ${localWater.h.toFixed(2)} m\nWASD / стрелки: идти   Space: прыжок   мышь: камера   4: следы`;}}
resize();setView('wide');renderNow();status.hidden=true;hud.textContent='v9 test · sim 256² · sand 1024² · foam 512²\nWASD / стрелки: идти · Space: прыжок · мышь: камера\n4: показать следы · R: сброс · F: следовать';canvas.focus();window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>lastTime=performance.now());
function readField(rt){const a=new Float32Array(rt.width*rt.height*4);gpu.readRenderTargetPixels(rt,0,0,rt.width,rt.height,a);return a;}
function fieldStats(){const state=readField(sim.target),wet=readField(sim.wetTarget),foam=readField(foamTargets[foamIndex]);let mass=0,minH=Infinity,maxH=0,maxV=0,bad=0,trackSum=0,trackCells=0,foamSum=0;for(let i=0;i<state.length;i+=4){const h=state[i];if(!Number.isFinite(h)||!Number.isFinite(state[i+1])||!Number.isFinite(state[i+2]))bad++;mass+=h*.125*.125;minH=Math.min(minH,h);maxH=Math.max(maxH,h);if(h>.01)maxV=Math.max(maxV,Math.hypot(state[i+1],state[i+2])/h);}for(const i of sandActive){trackSum+=sandData[i*4+1];if(sandData[i*4+1]>.15)trackCells++;}for(let i=0;i<foam.length;i+=4)foamSum+=foam[i];return {mass,minH,maxH,maxV,bad,trackSum,trackCells,foamSum};}
window.shoreDemo={build:BUILD,sand:{data:sandData,resolution:SAND_N,sample:sandAt,stamp:stampSand,upload:uploadSand,clear:clearSand,stats:()=>{let lo=0,hi=0;for(const i of sandActive){lo=Math.min(lo,sandData[i*4]);hi=Math.max(hi,sandData[i*4]);}return {cells:sandActive.size,min:lo,max:hi,removed:sandRemoved,deposited:sandDeposited};}},player,orbit,sim,gpu,gl,bedData,fieldAt,setView,reset:resetDemo,render:renderNow,trailDemo,shaderErrors,get time(){return simulationTime;},get diagnostics(){return {renderer:'Native WebGL2',quality:autoQuality?'auto':quality,renderScale:W/innerWidth,msaa:msaaTarget?msaaTarget.samples:0,offline:true,resolution:256,sandResolution:SAND_N,foamResolution:512,frames:frameNumber,fps,cpuMs,gpuCompute,gpuRender,substeps,player:{...player},water:{...localWater},grassTufts:grassMesh.instances,grassTriangles:grassMesh.renderedTriangles,groundTriangles:groundMesh.renderedTriangles,drawCalls,shaderErrors:shaderErrors.slice()};},pause(v=true){paused=v;lastTime=performance.now();},setDiagnostics(v){Object.assign(visualFlags,v);renderNow();},setKeys(codes){keys.clear();codes.forEach(k=>keys.add(k));},jump(){jumpQueued=true;},teleport(x,z,y=null){resetPlayer(x,z);if(y!==null)player.y=y;},async samplePlayer(){localWater=await sim.sample(player.x,player.z);return {...localWater};},step(seconds=1/60,move=false){let left=seconds;while(left>1e-7){const dt=Math.min(1/60,left);if(move)localWater=sim.sampleNow(player.x,player.z);advance(dt,move);left-=dt;}updateCamera(0);},stats:fieldStats,readField,targets:{surface:surfaceTarget,sand:sandTexture,bed:bedTarget,reflection:()=>reflectionTarget,opaque:()=>opaqueTarget,foam:()=>foamTargets[foamIndex]},setFoam(v){foamAmount=v;},setExposure(v){exposure=v;},setOrbit(v){Object.assign(orbit,v);updateCamera(0);},setQuality:setQualityMode};
requestAnimationFrame(frame);

}catch(error){console.error(error);const box=document.getElementById('status');box.hidden=false;box.textContent='Не удалось запустить Shore water: '+error.message;document.getElementById('hud').textContent='WebGL2 initialization failed';}})();
