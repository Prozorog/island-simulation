<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shore Water · слоистая вода · прототип 2.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#343b46;color:#e5eced;font:14px Arial,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}button,input,select{font:inherit}button{cursor:pointer}#menu{position:fixed;right:max(8px,env(safe-area-inset-right));top:8px;z-index:3}#toggle{display:block;margin-left:auto;background:#0c151cee;color:inherit;border:1px solid #ffffff25;padding:10px 14px;border-radius:7px;min-width:220px;text-align:left}#panel{width:270px;background:#101b23ef;padding:16px;border:1px solid #ffffff20;border-radius:8px;margin-top:6px}#panel[hidden]{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:13px 0}.views{display:grid;grid-template-columns:1fr 1fr;gap:6px}button,select{color:inherit;background:#263946;border:1px solid #ffffff25;border-radius:5px;padding:8px}input[type=range]{width:120px}#hud{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:10px;z-index:2;background:#111b23bd;padding:9px 12px;border-radius:6px;font:12px/1.5 monospace;white-space:pre-line;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;background:#343b46;z-index:5;padding:24px}#loading[hidden]{display:none}#legacy{display:none;position:fixed;inset:0;width:100%;height:100%;border:0}#fallback{position:fixed;left:10px;top:10px;z-index:6;background:#14222bea;padding:12px;max-width:420px;border-radius:8px}#fallback[hidden]{display:none}#graphicsDetails{position:fixed;left:10px;top:105px;z-index:7;max-width:min(650px,95vw);max-height:70vh;overflow:auto;background:#10202aee;padding:12px;border-radius:8px}#graphicsDetails[hidden]{display:none}#graphicsError{white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.4 monospace}#stick,#jump{display:none}@media(pointer:coarse){#stick,#jump{display:block;position:fixed;z-index:3;touch-action:none;background:#24384999;border:1px solid #ffffff40;border-radius:50%}#stick{left:22px;bottom:85px;width:96px;height:96px}#nub{position:absolute;left:30px;top:30px;width:34px;height:34px;border-radius:50%;background:#cedde1aa}#jump{right:24px;bottom:100px;width:68px;height:68px;color:#fff}}@media(max-width:600px){#toggle{min-width:170px}#panel{width:240px}#hud{font-size:10px;max-width:95vw}}
</style></head><body><canvas id="view" tabindex="0" aria-label="Береговая симуляция. WASD — движение, пробел — прыжок, мышь — камера."></canvas><iframe id="legacy" title="Совместимая версия V9"></iframe><div id="menu"><button id="toggle" aria-expanded="false">Слоистая вода · тест 2.1 · WebGPU</button><section id="panel" hidden><div class="views"><button data-view="wide">Общий вид</button><button data-view="shore">Берег</button><button data-view="water">Вода</button><button data-view="grass">Трава</button></div><label class="row">Следовать <input id="follow" type="checkbox"></label><label class="row">Волны <input id="waves" type="checkbox" checked></label><label class="row">Пена <input id="foam" type="range" min="0" max="1.8" step=".05" value="1"></label><label class="row">Качество <select id="quality"><option value="1">Высокое</option><option value=".8">Сбалансированное</option></select></label><button id="reset" style="width:100%">Сбросить сцену</button><button id="legacyButton" style="width:100%;margin-top:7px">Сравнить с V9</button><p style="font-size:12px;line-height:1.5;color:#b7c9d1">WASD / стрелки — идти<br>Пробел — прыжок<br>Мышь / касание — камера<br>Колесо — приближение · F — следовать</p></section></div><div id="hud">Подготавливаю сцену…</div><div id="stick"><div id="nub"></div></div><button id="jump">Прыжок</button><div id="loading"><div id="status">Подготавливаю берег…</div></div><div id="fallback" hidden></div><details id="graphicsDetails" hidden><summary>Точная ошибка WebGPU</summary><pre id="graphicsError"></pre><button id="copyDiagnostics">Скопировать диагностику</button></details><script>/*__APP__*/</script></body></html>
