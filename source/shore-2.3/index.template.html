n="0.8" max="4" step="0.1"/><output id="chartLifeValue"></output></span></label><label class="row">Ветер, м/с <span><input id="wind" type="range" min="0" max="8" step="0.1"/><output id="windValue"></output></span></label><label class="row">Микрорельеф <span><input id="microStrength" type="range" min="0" max="1.5" step="0.05"/><output id="microStrengthValue"></output></span></label><label class="row">Каустика <span><input id="causticStrength" type="range" min="0" max="1" step="0.05"/><output id="causticStrengthValue"></output></span></label><label class="row">Рябь от тела <span><input id="rippleStrength" type="range" min="0" max="0.15" step="0.005"/><output id="rippleStrengthValue"></output></span></label><label class="row">Затухание ряби <span><input id="rippleDamping" type="range" min="0.5" max="5" step="0.1"/><output id="rippleDampingValue"></output></span></label><label class="row">Зона фокуса, м <span><input id="focalLength" type="range" min="1" max="12" step="0.25"/><output id="focalLengthValue"></output></span></label><label class="row">Размытие <span><input id="bokeh" type="range" min="0" max="1.5" step="0.05"/><output id="bokehValue"></output></span></label><label class="row">Свечение воды <span><input id="bloomStrength" type="range" min="0" max="0.5" step="0.01"/><output id="bloomStrengthValue"></output></span></label><label class="row">Поглощение R<span><input id="absorptionx" type="range" min="0" max="1.5" step=".01"/><output id="absorptionxValue"></output></span></label><label class="row">Поглощение G<span><input id="absorptiony" type="range" min="0" max="1.5" step=".01"/><output id="absorptionyValue"></output></span></label><label class="row">Поглощение B<span><input id="absorptionz" type="range" min="0" max="1.5" step=".01"/><output id="absorptionzValue"></output></span></label><label class="row">Свет в воде R<span><input id="inscatterx" type="range" min="0" max="0.5" step=".01"/><output id="inscatterxValue"></output></span></label><label class="row">С
